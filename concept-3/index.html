<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7D International — Concept 3</title>
<meta name="description" content="7D International: global contracting and consulting since 1993. Seven disciplines, five hubs, Middle East headquarters in Riyadh.">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="../assets/brand/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Concept 3 — instrument at night, editorial by day.
   A dark opening carries the two WebGL moments; the page then turns to pale
   limestone for the disciplines and ends back in the night for the work. */
:root{
  --night:#0B0B0A; --night-2:#141412; --night-ink:#F1ECE2; --night-dim:#A39C8F; --night-line:rgba(241,236,226,.12);
  --stone:#EDE8DF; --stone-2:#E3DCD0; --ink:#221C17; --ink-dim:#61574D; --stone-line:rgba(34,28,23,.14);
  --brass:#9C6A22; --brass-hi:#E0A94A; --plum:#3B2C33;
  --display:'Familjen Grotesk','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(20px,4.2vw,56px);
}
html[dir="rtl"]{--display:'Tajawal',system-ui,sans-serif;--body:'Tajawal',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--night);color:var(--night-ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased}
::selection{background:var(--brass-hi);color:var(--night)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:4px;border-radius:3px}
img{display:block;max-width:100%}

/* film grain over everything, very quiet */
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain .9s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}

/* ---------- preloader ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--night);display:grid;place-items:end start;padding:var(--gut);transition:clip-path 1.1s var(--ease)}
.loader.done{clip-path:inset(0 0 100% 0)}
.loader-count{font-family:var(--display);font-weight:500;font-size:clamp(4rem,14vw,12rem);line-height:.8;letter-spacing:-.05em;color:var(--night-ink);font-variant-numeric:tabular-nums}
.loader-line{position:absolute;inset-inline:var(--gut);bottom:calc(var(--gut) - 14px);height:1px;background:var(--night-line)}
.loader-line i{display:block;height:100%;width:0;background:var(--brass-hi);transition:width .25s linear}
.loader-name{position:absolute;top:var(--gut);inset-inline-start:var(--gut);font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--night-dim)}

/* ---------- cursor ---------- */
.cursor{position:fixed;left:0;top:0;z-index:95;pointer-events:none;display:none}
.cursor i{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.cursor .dot{width:5px;height:5px;background:var(--brass-hi)}
.cursor .ring{width:38px;height:38px;border:1px solid rgba(224,169,74,.55);transition:width .35s var(--ease),height .35s var(--ease),background .35s}
.cursor.hover .ring{width:74px;height:74px;background:rgba(224,169,74,.08)}
@media(hover:hover) and (pointer:fine){.cursor{display:block}}

/* ---------- header ---------- */
.header{position:fixed;inset-inline:0;top:0;z-index:60;padding:20px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px;
  color:var(--night-ink);transition:color .6s var(--ease),transform .6s var(--ease)}
.header.on-stone{color:var(--ink)}
.header.hide{transform:translateY(-110%)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand img{width:30px;height:36px;object-fit:contain;transition:filter .6s}
.header.on-stone .brand img{filter:invert(1) brightness(.3)}
.brand span{font-family:var(--display);font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span b{font-weight:500;opacity:.55}
.nav-r{display:flex;align-items:center;gap:10px}
.pill{height:42px;padding:0 20px;border-radius:999px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:14px;
  position:relative;overflow:hidden;isolation:isolate}
.pill::before{content:"";position:absolute;inset:0;background:var(--brass-hi);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.pill:hover{color:var(--night);border-color:var(--brass-hi)}
.pill:hover::before{transform:none}
.sound{width:42px;height:42px;border-radius:50%;border:1px solid currentColor;display:grid;grid-auto-flow:column;align-items:center;justify-content:center;gap:3px}
.sound i{width:2px;height:5px;background:currentColor;border-radius:2px}
.sound.on i{animation:bars 1.1s ease-in-out infinite}
.sound.on i:nth-child(2){animation-delay:-.35s}.sound.on i:nth-child(3){animation-delay:-.7s}.sound.on i:nth-child(4){animation-delay:-.2s}
@keyframes bars{0%,100%{height:4px}50%{height:17px}}
@media(max-width:640px){.brand span{display:none}.pill.touch{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;height:170vh}
.hero-stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;align-content:end;padding:0 var(--gut) clamp(34px,7vh,72px)}
.hero-gl{position:absolute;inset:0;z-index:0}
.hero-gl canvas{width:100%;height:100%;display:block}
.hero-gl::after{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 30% 100%,rgba(11,11,10,.9) 0%,rgba(11,11,10,.2) 55%,transparent 75%)}
.hero-copy{position:relative;z-index:1;display:grid;gap:26px;max-width:1400px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(3rem,9.2vw,9.4rem);line-height:.9;letter-spacing:-.055em;max-width:12ch}
html[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.15;font-weight:700;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--brass-hi)}
.hero-row{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px 40px}
.hero-sub{max-width:46ch;color:var(--night-dim);font-size:clamp(1rem,1.3vw,1.12rem)}
.hero-meta{display:flex;gap:28px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--night-dim)}
html[dir="rtl"] .hero-meta{font-family:var(--body);letter-spacing:0;font-size:14px}
.hero-meta b{display:block;font-family:var(--display);font-weight:500;letter-spacing:-.02em;font-size:clamp(1.6rem,2.6vw,2.4rem);color:var(--night-ink);text-transform:none;margin-bottom:2px}
/* lines rise through a mask */
.mask{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.mask>span{display:inline-block;transform:translateY(105%);transition:transform 1.3s var(--ease)}
.ready .mask>span{transform:none}
.fade-up{opacity:0;transform:translateY(18px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.ready .fade-up{opacity:1;transform:none}

/* ---------- statement: words fill as you read ---------- */
.statement{position:relative;padding:clamp(120px,22vh,240px) var(--gut) clamp(120px,20vh,220px);background:var(--night)}
.statement p{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.1vw,4rem);line-height:1.12;letter-spacing:-.03em;max-width:24ch}
html[dir="rtl"] .statement p{letter-spacing:0;line-height:1.5}
.statement .w{color:rgba(241,236,226,.14);transition:color .5s}
.statement .w.on{color:var(--night-ink)}
.statement .w.hl.on{color:var(--brass-hi)}
.statement small{display:block;margin-top:40px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--night-dim)}
html[dir="rtl"] .statement small{font-family:var(--body);letter-spacing:0;font-size:14px}

/* ---------- mark ---------- */
.mark{position:relative;height:300vh;background:linear-gradient(180deg,var(--night) 0%,var(--night) 62%,#2C2822 84%,var(--stone) 100%)}
.mark-stage{position:sticky;top:0;height:100svh;overflow:hidden}
.mark-gl{position:absolute;inset:0}
.mark-gl canvas{width:100%;height:100%;display:block}
.mark-copy{position:absolute;inset-inline:var(--gut);bottom:clamp(30px,7vh,70px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px 40px;z-index:1}
.mark-copy h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,4.6rem);letter-spacing:-.045em;line-height:.95}
html[dir="rtl"] .mark-copy h2{letter-spacing:0;line-height:1.2;font-weight:700}
.hubs{display:flex;flex-wrap:wrap;gap:10px 26px;list-style:none;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
html[dir="rtl"] .hubs{font-family:var(--body);letter-spacing:0;font-size:15px}
.hubs li{color:rgba(241,236,226,.22);transition:color .6s;display:flex;align-items:center;gap:9px}
.hubs li::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;transition:box-shadow .6s}
.hubs li.on{color:var(--brass-hi)}
.hubs li.on::before{box-shadow:0 0 0 4px rgba(224,169,74,.18)}
.mark-index{position:absolute;top:clamp(90px,14vh,130px);inset-inline-start:var(--gut);font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--night-dim);z-index:1}
html[dir="rtl"] .mark-index{font-family:var(--body);letter-spacing:0;font-size:14px}

/* ---------- tree ---------- */
.tree{position:relative;height:340vh;background:var(--stone);color:var(--ink)}
.tree-stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr;padding:clamp(96px,13vh,130px) var(--gut) 0}
.tree-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px 40px}
.tree-head h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,4.6rem);letter-spacing:-.045em;line-height:.95}
html[dir="rtl"] .tree-head h2{letter-spacing:0;line-height:1.2;font-weight:700}
.tree-head p{max-width:40ch;color:var(--ink-dim)}
.tree-fig{position:relative;align-self:end;width:min(100%,1180px);margin:0 auto;aspect-ratio:1000/560;max-height:calc(100svh - 230px)}
.tree-fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tree-fig .arc{fill:none;stroke:var(--stone-line);stroke-width:1;vector-effect:non-scaling-stroke}
.tree-fig .br{fill:none;stroke:url(#brGrad);stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.tree-fig .br-glow{fill:none;stroke:var(--brass-hi);stroke-width:7;stroke-linecap:round;opacity:.0;filter:blur(5px);vector-effect:non-scaling-stroke;transition:opacity .4s}
.tree-fig .br-glow.hot{opacity:.35}
.tree-fig .trunk{fill:none;stroke:var(--plum);stroke-width:1.6;vector-effect:non-scaling-stroke}
.orb{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%) scale(0);transition:transform .7s var(--ease);
  background:radial-gradient(circle at 35% 30%,#FFE7B5 0%,#E0A94A 35%,#8A5A1B 80%);box-shadow:0 2px 10px rgba(156,106,34,.45)}
.orb.on{transform:translate(-50%,-50%) scale(1)}
.orb::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(156,106,34,.5);opacity:0}
.orb.on::after{animation:orb 2.8s ease-out infinite}
@keyframes orb{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2);opacity:0}}
.root{position:absolute;left:50%;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--plum);transform:translate(-50%,50%)}
.root::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid var(--stone-line)}
.lbl{position:absolute;width:max-content;max-width:min(190px,17vw);opacity:0;transition:opacity .7s var(--ease),transform .7s var(--ease)}
.lbl.on{opacity:1}
.lbl button{display:grid;gap:3px;text-align:start;padding:8px 12px;border-radius:10px;transition:background .35s}
.lbl button:hover,.lbl button[aria-pressed="true"]{background:rgba(34,28,23,.06)}
.lbl b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--brass)}
.lbl span{font-family:var(--display);font-weight:500;font-size:clamp(13px,1.3vw,17px);line-height:1.2;letter-spacing:-.01em}
html[dir="rtl"] .lbl span{font-family:var(--body);font-weight:500;font-size:clamp(14px,1.35vw,17px);letter-spacing:0}
.lbl.left{transform:translate(calc(-100% - 14px),-50%)}
.lbl.right{transform:translate(14px,-50%)}
.lbl.top{transform:translate(-50%,calc(-100% - 16px));text-align:center}
.lbl.top button{text-align:center;justify-items:center}
.tree-note{position:absolute;inset-inline-start:54%;bottom:3%;width:min(38%,400px);text-align:start;color:var(--ink-dim);font-size:15px;min-height:4.8em;transition:opacity .5s;
  padding-inline-start:18px;border-inline-start:1px solid var(--stone-line)}
.tree-note strong{display:block;color:var(--ink);font-family:var(--display);font-weight:500;font-size:clamp(16px,1.6vw,20px);margin-bottom:6px;letter-spacing:-.01em}
.tree-list{display:none}
@media(max-width:820px){
  .tree{height:auto}
  .tree-stage{position:relative;height:auto;padding-bottom:80px}
  .tree-fig{display:none}
  .tree-list{display:block;list-style:none;margin-top:40px;border-inline-start:1.5px solid var(--plum);margin-inline-start:6px}
  .tree-list li{position:relative;padding:18px 0 18px 30px}
  html[dir="rtl"] .tree-list li{padding:18px 30px 18px 0}
  .tree-list li::before{content:"";position:absolute;inset-inline-start:0;top:31px;width:20px;height:1.5px;background:var(--plum)}
  .tree-list li::after{content:"";position:absolute;inset-inline-start:17px;top:26px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7B5,#E0A94A 40%,#8A5A1B)}
  .tree-list b{display:block;margin-inline-start:14px;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--brass)}
  .tree-list h3{margin-inline-start:14px;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.25}
  .tree-list p{margin:6px 0 0 14px;color:var(--ink-dim);font-size:14.5px}
  html[dir="rtl"] .tree-list p{margin:6px 14px 0 0}
}

/* ---------- work: horizontal cinema ---------- */
.work{position:relative;height:420vh;background:var(--night)}
.work-stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.work-head{padding:clamp(96px,13vh,130px) var(--gut) 0;display:flex;justify-content:space-between;align-items:end;gap:20px}
.work-head h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,4.6rem);letter-spacing:-.045em;line-height:.95}
html[dir="rtl"] .work-head h2{letter-spacing:0;line-height:1.2;font-weight:700}
.work-count{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--night-dim);font-variant-numeric:tabular-nums}
.work-count b{color:var(--night-ink);font-weight:400}
.track{align-self:center;display:flex;gap:4vw;padding-inline:var(--gut);will-change:transform}
.panel{position:relative;flex:0 0 min(70vw,1080px);aspect-ratio:16/9;max-height:62svh;border-radius:14px;overflow:hidden;background:var(--night-2)}
.panel .pic{position:absolute;inset:-6% -12%;will-change:transform}
.panel img{width:100%;height:100%;object-fit:cover}
.panel[data-i="1"] img{object-position:center 50%}
.panel[data-i="3"] img{object-position:center 18%}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,10,0) 45%,rgba(11,11,10,.86) 100%)}
.panel .cap{position:absolute;inset-inline:clamp(18px,2.4vw,34px);bottom:clamp(16px,2.4vw,30px);z-index:1;display:flex;justify-content:space-between;align-items:end;gap:16px}
.panel .cap b{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--brass-hi);text-transform:uppercase}
html[dir="rtl"] .panel .cap b{font-family:var(--body);letter-spacing:0;font-size:14px;text-transform:none}
.panel .cap h3{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2.8vw,2.8rem);letter-spacing:-.035em;line-height:1;margin-top:8px}
html[dir="rtl"] .panel .cap h3{letter-spacing:0;line-height:1.3;font-weight:700}
.panel .cap a{flex:none;font-size:13px;color:var(--night-ink);text-underline-offset:5px;opacity:.85}
.panel .num{position:absolute;top:clamp(14px,2vw,26px);inset-inline-start:clamp(18px,2.4vw,34px);z-index:1;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--night-ink)}
@media(max-width:820px){
  .work{height:auto}
  .work-stage{position:relative;height:auto;padding-bottom:60px}
  .track{flex-direction:column;transform:none!important;gap:18px;margin-top:30px}
  .panel{flex:none;width:100%;max-height:none;aspect-ratio:4/3}
  .panel .pic{inset:0;transform:none!important}
  .panel .cap{flex-direction:column;align-items:start}
}

/* ---------- close ---------- */
.close{position:relative;background:var(--night);padding:clamp(120px,20vh,220px) var(--gut) 34px;overflow:hidden}
.close h2{font-family:var(--display);font-weight:500;font-size:clamp(3.2rem,11vw,11rem);letter-spacing:-.06em;line-height:.86}
html[dir="rtl"] .close h2{letter-spacing:0;line-height:1.15;font-weight:700}
.close h2 em{font-style:normal;color:var(--brass-hi)}
.close-row{margin-top:48px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px}
.close-row p{max-width:40ch;color:var(--night-dim)}
.close-row .acts{display:flex;flex-wrap:wrap;gap:12px}
.direct{margin-top:26px;font-size:15px;color:var(--night-dim)}
.direct a{text-underline-offset:5px}
.foot{margin-top:90px;padding-top:22px;border-top:1px solid var(--night-line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--night-dim);text-transform:uppercase}
html[dir="rtl"] .foot{font-family:var(--body);letter-spacing:0;font-size:13px;text-transform:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .loader{display:none}
  .mask>span,.fade-up{transform:none;opacity:1}
  .statement .w{color:var(--night-ink)}
  .orb{transform:translate(-50%,-50%) scale(1)}.lbl{opacity:1}
  .grain{display:none}
}
</style>
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-name">7D INTERNATIONAL</div>
  <div class="loader-count" id="loaderCount">0</div>
  <div class="loader-line"><i id="loaderLine"></i></div>
</div>
<canvas class="grain" id="grain" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"><i class="ring"></i><i class="dot"></i></div>

<header class="header" id="header">
  <a class="brand" href="#top"><img src="../assets/brand/logo.png" alt="7D International" width="30" height="36"><span data-i="brand">7D <b>— global contracting &amp; consulting.</b></span></a>
  <div class="nav-r">
    <button class="pill" id="lang" type="button">عربي</button>
    <a class="pill touch" href="mailto:info@7dint.net" data-i="touch">Get in touch</a>
    <button class="sound" id="sound" type="button" aria-pressed="false"><i></i><i></i><i></i><i></i></button>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="hero-stage">
      <div class="hero-gl" aria-hidden="true"><canvas id="heroGL"></canvas></div>
      <div class="hero-copy">
        <h1 id="heroTitle"></h1>
        <div class="hero-row">
          <p class="hero-sub fade-up" data-i="sub"></p>
          <div class="hero-meta fade-up" id="heroMeta"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="statement" id="statement" aria-label="About">
    <p id="statementText"></p>
    <small data-i="statementSrc"></small>
  </section>

  <section class="mark" id="mark" aria-labelledby="markTitle">
    <div class="mark-stage">
      <div class="mark-gl" aria-hidden="true"><canvas id="markGL"></canvas></div>
      <div class="mark-index" data-i="markIndex"></div>
      <div class="mark-copy">
        <h2 id="markTitle" data-i="markH"></h2>
        <ul class="hubs" id="hubs"></ul>
      </div>
    </div>
  </section>

  <section class="tree" id="tree" aria-labelledby="treeTitle">
    <div class="tree-stage">

 en:{brand:'7D <b>— global contracting & consulting.</b>',touch:'Get in touch',lang:'عربي',langLabel:'العربية',sound:'Ambient sound',

};
let LANG=new URLSearchParams(location.search).get('lang')||localStorage.getItem('7d_c3_lang')||'en';
if(!I[LANG])LANG='en';

/* ---------- film grain, drawn once ---------- */
{const c=$('#grain'),x=c.getContext('2d');c.width=c.height=220;const d=x.createImageData(220,220);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
 x.putImageData(d,0,0);c.style.width='200%';c.style.height='200%';c.style.imageRendering='pixelated';}

/* ---------- builders ---------- */
function buildHero(){
  const L=I[LANG];
  $('#heroTitle').innerHTML=L.h1.map((l,i)=>`<span class="mask"><span style="transition-delay:${.15+i*.12}s">${l[0]}</span></span>`).join('');
  $('#heroMeta').innerHTML=L.meta.map(m=>`<div><b>${m[0]}</b>${m[1]}</div>`).join('');
}
function buildStatement(){
  // *word* marks a highlighted figure
  const words=I[LANG].statement.split(/\s+/);
  $('#statementText').innerHTML=words.map(w=>{const hl=/^\*.*\*[.,]?$/.test(w);return `<span class="w${hl?' hl':''}">${w.replace(/\*/g,'')}</span>`;}).join(' ');
}
function buildHubs(){$('#hubs').innerHTML=HUBS.map(h=>`<li>${h[LANG]}</li>`).join('');}

/* The tree: seven curved branches fanning up from one trunk. Each branch leaves
   the trunk vertically and bends toward its tip, so the fan reads as grown rather
   than ruled. Labels sit outside their tips so no text crosses a branch. */
let BR=[],pinned=-1;
function buildTree(){
  const rtl=LANG==='ar';
  const arcs=$('#treeArcs'),glow=$('#treeGlow'),brG=$('#treeBr');arcs.innerHTML=glow.innerHTML=brG.innerHTML='';
  $$('#treeFig .orb,#treeFig .lbl').forEach(n=>n.remove());
  for(let k=1;k<=4;k++){const r=k*120;const a=document.createElementNS(NS,'path');a.setAttribute('class','arc');a.setAttribute('d',`M${500-r} 560 A${r} ${r*.95} 0 0 1 ${500+r} 560`);arcs.appendChild(a);}
  const ox=500,oy=470,fig=$('#treeFig');
  BR=DISC.map((d,i)=>{
    const ang=(165-i*25)*Math.PI/180;
    let ex=ox+Math.cos(ang)*380, ey=oy-Math.sin(ang)*400;
    if(rtl)ex=1000-ex;
    const c1x=ox, c1y=oy-120, c2x=ox+(ex-ox)*.62, c2y=ey+(oy-ey)*.18;
    const dPath=`M${ox} ${oy} C${c1x} ${c1y}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}`;
    const g=document.createElementNS(NS,'path');g.setAttribute('class','br-glow');g.setAttribute('d',dPath);g.setAttribute('pathLength','1');g.style.strokeDasharray='1';g.style.strokeDashoffset='1';glow.appendChild(g);
    const p=document.createElementNS(NS,'path');p.setAttribute('class','br');p.setAttribute('d',dPath);p.setAttribute('pathLength','1');p.style.strokeDasharray='1';p.style.strokeDashoffset='1';brG.appendChild(p);
    const side=[ 'top','left','top','top','top','right','top' ][i];
    const place=rtl?(side==='left'?'right':side==='right'?'left':side):side;
    const orb=document.createElement('span');orb.className='orb';orb.style.left=ex/10+'%';orb.style.top=ey/5.6+'%';fig.appendChild(orb);
    const lbl=document.createElement('div');lbl.className='lbl '+place;lbl.style.left=ex/10+'%';lbl.style.top=ey/5.6+'%';
    lbl.innerHTML=`<button type="button" aria-pressed="false" data-d="${i}"><b>0${i+1}</b><span>${d[LANG][0]}</span></button>`;
    fig.appendChild(lbl);
    return {p,g,orb,lbl,start:.04+i*.1};
  });
  fig.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;pinned=pinned===+b.dataset.d?-1:+b.dataset.d;note();};
  fig.onmouseover=e=>{const b=e.target.closest('[data-d]');BR.forEach((x,i)=>x.g.classList.toggle('hot',b?+b.dataset.d===i:i===pinned));};
  $('#treeList').innerHTML=DISC.map((d,i)=>`<li><b>0${i+1}</b><h3>${d[LANG][0]}</h3><p>${d[LANG][1]}</p></li>`).join('');
}
let lastNote=-2;
function note(latest){
  const k=pinned>=0?pinned:latest;
  if(k===lastNote)return;lastNote=k;
  $$('.lbl button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===pinned)));
  BR.forEach((x,i)=>x.g.classList.toggle('hot',i===k));
  const n=$('#treeNote');
  n.innerHTML=k>=0?`<strong>${DISC[k][LANG][0]}</strong>${DISC[k][LANG][1]}`:'';
}
function buildWork(){
  $('#track').innerHTML=PROJ.map((p,i)=>`<article class="panel" data-i="${i}">
    <div class="pic"><img src="${p.img}" alt="${p[LANG][1]}" loading="${i?'lazy':'eager'}" decoding="async"></div>
    <div class="num">0${i+1}</div>
    <div class="cap"><div><b>${p[LANG][0]}</b><h3>${p[LANG][1]}</h3></div><a href="${p.src}" target="_blank" rel="noopener">${I[LANG].link}</a></div>
  </article>`).join('');
}
function applyLang(boot){
  const L=I[LANG];
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  $$('[data-i]').forEach(el=>{const v=L[el.dataset.i];if(v==null)return;el.innerHTML=v;});
  $('#lang').textContent=L.lang;$('#lang').setAttribute('aria-label',L.langLabel);$('#sound').setAttribute('aria-label',L.sound);
  document.title=LANG==='ar'?'7D International — المفهوم 3':'7D International — Concept 3';
  buildHero();buildStatement();buildHubs();buildTree();buildWork();pinned=-1;lastNote=-2;
  // on a language switch the headline re-rises; a timer, not a frame, so a hidden tab cannot strand it
  if(!boot)setTimeout(()=>document.body.classList.add('ready'),40);
}
$('#lang').addEventListener('click',()=>{LANG=LANG==='ar'?'en':'ar';localStorage.setItem('7d_c3_lang',LANG);document.body.classList.remove('ready');applyLang();update(true);});

/* ---------- smooth scroll ---------- */
let lenis=null;
if(!REDUCED&&window.Lenis){lenis=new Lenis({lerp:.085,smoothWheel:true,wheelMultiplier:.9});}

/* ---------- WebGL, loaded after first paint and never blocking the page ---------- */
let hero=null,mark=null;
const glReady=import('./c3-scene.js').then(m=>{
  try{hero=m.initHero($('#heroGL'));}catch(e){console.warn('hero gl',e);}
  try{mark=m.initMark($('#markGL'));}catch(e){console.warn('mark gl',e);}
  addEventListener('resize',()=>{hero?.resize();mark?.resize();});
}).catch(e=>console.warn('3D unavailable',e));

/* ---------- per-frame orchestration ---------- */
const prog=el=>{const r=el.getBoundingClientRect(),span=el.offsetHeight-innerHeight;return span>0?clamp(-r.top/span):(r.top<innerHeight?1:0);};
const inView=el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;};
let lastY=0;
function update(force){
  const y=scrollY;
  // header: hides on the way down, returns on the way up, turns dark over limestone
  const hdr=$('#header'),tr=$('#tree').getBoundingClientRect();
  hdr.classList.toggle('on-stone',tr.top<60&&tr.bottom>60);
  if(!force)hdr.classList.toggle('hide',y>lastY+2&&y>innerHeight*.6);
  if(y<lastY-2)hdr.classList.remove('hide');
  lastY=y;

  // statement words fill in reading order
  const st=$('#statement'),sr=st.getBoundingClientRect(),sp=clamp((innerHeight*.78-sr.top)/(sr.height*.8));
  const ws=$$('#statementText .w');ws.forEach((w,i)=>w.classList.toggle('on',REDUCED||sp>=(i+1)/ws.length));

  // mark hubs
  const mp=REDUCED?1:prog($('#mark'));
  $$('#hubs li').forEach((li,i)=>li.classList.toggle('on',mp>.68+i*.05));

  // tree
  if(innerWidth>820){
    const tp=REDUCED?1:prog($('#tree'));let latest=-1;
    BR.forEach((b,i)=>{const k=ease(clamp((tp-b.start)/.14));b.p.style.strokeDashoffset=1-k;b.g.style.strokeDashoffset=1-k;
      const done=k>.98;b.orb.classList.toggle('on',done);b.lbl.classList.toggle('on',k>.8);if(done)latest=i;});
    note(latest);
  }

  // work: the track slides, each photo drifts against it, the counter follows
  if(innerWidth>820){
    const wp=REDUCED?0:prog($('#work')),track=$('#track');
    const max=track.scrollWidth-innerWidth;const dir=LANG==='ar'?1:-1;
    track.style.transform=`translate3d(${dir*max*wp}px,0,0)`;
    const panels=$$('.panel');let best=0,bestD=1e9;
    panels.forEach((p,i)=>{const r=p.getBoundingClientRect(),c=r.left+r.width/2,d=(c-innerWidth/2)/innerWidth;
      p.querySelector('.pic').style.transform=`translate3d(${-d*9}%,0,0) scale(1.06)`;
      if(Math.abs(d)<bestD){bestD=Math.abs(d);best=i;}});
    $('#workNow').textContent='0'+(best+1);
  }
}

let t0=performance.now();
function frame(now){
  lenis?.raf(now);
  update();
  const t=(now-t0)/1000;
  if(hero&&inView($('#hero')))hero.render(t,REDUCED?0:prog($('#hero')));
  if(mark&&inView($('#mark')))mark.render(t,REDUCED?1:prog($('#mark')));
  requestAnimationFrame(frame);
}

/* ---------- cursor ---------- */
if(!TOUCH&&!REDUCED){
  const cur=$('#cursor'),ring=cur.querySelector('.ring'),dot=cur.querySelector('.dot');let mx=-100,my=-100,rx=-100,ry=-100;
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;},{passive:true});
  addEventListener('pointerover',e=>cur.classList.toggle('hover',!!e.target.closest('a,button')));
  (function loop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;dot.style.transform=`translate(${mx}px,${my}px)`;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop);})();
}

/* ---------- ambient pad: synthesised, starts only on click ---------- */
let pad=null;
$('#sound').addEventListener('click',()=>{
  const btn=$('#sound');
  if(!pad){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),out=ctx.createGain();out.gain.value=0;
    const verb=ctx.createConvolver();{const len=ctx.sampleRate*3.2,buf=ctx.createBuffer(2,len,ctx.sampleRate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}verb.buffer=buf;}
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(verb);lp.connect(out);verb.connect(out);out.connect(ctx.destination);
    [[98,.05,'sawtooth'],[98.6,.05,'sawtooth'],[146.8,.03,'triangle'],[196.2,.02,'sine'],[293.7,.012,'sine']].forEach(([f,g,t])=>{const o=ctx.createOscillator(),gg=ctx.createGain();o.type=t;o.frequency.value=f;gg.gain.value=g;o.connect(gg).connect(lp);o.start();});
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.06;lg.gain.value=320;l.connect(lg).connect(lp.frequency);l.start();
    pad={ctx,out,on:false};}
  pad.on=!pad.on;if(pad.ctx.state==='suspended')pad.ctx.resume();
  pad.out.gain.setTargetAtTime(pad.on?.5:0,pad.ctx.currentTime,.8);
  btn.classList.toggle('on',pad.on);btn.setAttribute('aria-pressed',String(pad.on));
});

/* ---------- preloader: counts real readiness, never traps the page ---------- */
applyLang(true);
const steps=[document.fonts?.ready||Promise.resolve(),glReady,new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=PROJ[0].img;})];
let done=0,shown=0;const target=()=>Math.round(done/steps.length*100);
steps.forEach(s=>s.then(()=>{done++;}));
const loader=$('#loader');
function finish(){if(loader.classList.contains('done'))return;$('#loaderCount').textContent='100';$('#loaderLine').style.width='100%';
  loader.classList.add('done');setTimeout(()=>{document.body.classList.add('ready');},250);setTimeout(()=>loader.remove(),1400);}
if(REDUCED){loader.remove();document.body.classList.add('ready');}
else{
  const began=performance.now();
  (function count(){shown+=(target()-shown)*.12+.15;shown=Math.min(shown,target()||shown);const v=Math.min(100,Math.round(shown));
    $('#loaderCount').textContent=v;$('#loaderLine').style.width=v+'%';
    if(done===steps.length&&performance.now()-began>1200&&v>=99)finish();else if(!loader.classList.contains('done'))requestAnimationFrame(count);})();
  setTimeout(finish,5000);            // whatever happens, the site is reachable within five seconds
}
/* inspection handle for QA scripts */
window.c3={get hero(){return hero},get mark(){return mark},update,prog};
requestAnimationFrame(frame);
